<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODAM - 포트폴리오</title>

    <meta name="description"
        content="MODAM 모담은 미드센추리 모던 감성을 현대적으로 재해석한 가구 브랜드입니다. 소파, 테이블, 체어, 수납가구 등 감각적인 디자인 가구로 나만의 공간을 완성해보세요." />
    <meta name="keywords" content="모담, MODAM, 가구, 가구쇼핑몰, 디자인가구, 미드센추리모던, 인테리어가구, 소파, 테이블, 체어, 수납가구, 홈인테리어" />
    <meta name="author" content="MODAM" />
    <meta name="robots" content="index, follow" />

    <!-- 대표 URL -->
    <link rel="canonical" href="https://www.modam.co.kr/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MODAM" />
    <meta property="og:title" content="MODAM 모담 | Collect Style. Fill Life." />
    <meta property="og:description"
        content="공간에 취향을 모으고, 일상에 디자인을 담습니다. 미드센추리 모던 감성을 현대적으로 재해석한 MODAM의 가구 컬렉션을 만나보세요." />
    <meta property="og:url" content="https://www.modam.co.kr/" />
    <meta property="og:image" content="https://www.modam.co.kr/img/pc1.jpg" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon.png">
    
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">

    <link rel="stylesheet" href="./css/list.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    
    <script src="./js/new-product.js"></script>
    <script src="./js/new-product-control.js" defer></script>
    <script src="./js/include.js"></script>
    <script src="./js/header.js" defer></script>
</head>

<body>
    <div id="header-wrap">
        <!-- header.html 파일의 내용이 들어오는 영역 -->
    </div>

    <main>
        <div class="hero-banner">
            <a href="#">
                <picture>
                    <source media="(max-width:768px)" srcset="./img/banner-new-mo.jpg">
                    <source media="(max-width:1024px)" srcset="./img/banner-new-pad.jpg">
                    <img src="./img/banner-new-pc.jpg" alt="MODAM 쇼핑몰 신상품 배너 이미지">
                </picture>
            </a>
        </div>

        <section class="con1">
            <div class="common-frame">
                <div class="title">
                    <h1>NEW ARRIVALS</h1>
                    <span></span>
                    <p>새로운 취향이 시작되는 순간,<br>모담의 새로운 가구와 오브제를 만나보세요.</p>
                </div>

                <ul class="new-product grid-list">
                    <li>
                        <a href="#">
                            <figure>
                                <img src="./img/new1.jpg" alt="LUNO 루노 커브 소파">
                            </figure>
                            <div class="sale-txt">
                                <h4 class="title-1">LUNO 루노 커브 소파</h4>
                                <p class="desc-1">부드럽게 이어지는 곡선형 등받이와 넉넉한 좌방석이 편안한 휴식을 만들어주는 3인 소파입니다. 크림 패브릭과 월넛 다리의 조화로
                                    공간에 따뜻한 중심을 더합니다.
                                </p>
                                <div class="pay-frame">
                                    <div class="pay-original">
                                        <span>1,890,000</span>원
                                    </div>
                                    <div class="pay-discount">
                                        <div class="discount">20%</div>
                                        <div class="pay"><b>1,512,000</b>원</div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </section>


    </main>

    <div id="footer-wrap">
        <!-- footer.html 파일의 내용이 들어오는 영역 -->
    </div>
</body>

</html>
